name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify documentation checker
        run: python3 -m unittest scripts/tests/test_documentation_check.py

      - name: Verify documentation baseline
        env:
          DOCUMENTATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          documentation_base="${DOCUMENTATION_BASE_REF}"
          inventory_path="docs/maintenance/documentation-inventory.tsv"
          expected_header="$(printf 'path\ttracking\tkind\towner\tmigration_status\taction\ttarget\tverification')"
          actual_header="$(git show "${documentation_base}:${inventory_path}" 2>/dev/null | sed -n '1p' || true)"
          if [ "${actual_header}" != "${expected_header}" ]; then
            previous_base="${documentation_base}"
            documentation_base=""
            while read -r revision; do
              actual_header="$(git show "${revision}:${inventory_path}" 2>/dev/null | sed -n '1p' || true)"
              if [ "${actual_header}" = "${expected_header}" ]; then
                documentation_base="${revision}"
                break
              fi
            done < <(git log --reverse --format=%H "${previous_base}..HEAD" -- "${inventory_path}")
          fi
          test -n "${documentation_base}"
          python3 scripts/check-documentation.py --strict --base-ref "${documentation_base}"

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify backend, migrations and LLM contracts
        run: ./gradlew :backend:check --no-daemon

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run check
