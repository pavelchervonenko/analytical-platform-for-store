name: Release production images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    name: Verify and publish immutable images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release documentation
        run: |
          git fetch origin main --tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
          release_base="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          inventory_path="docs/maintenance/documentation-inventory.tsv"
          expected_header="$(printf 'path\ttracking\tkind\towner\tmigration_status\taction\ttarget\tverification')"
          actual_header="$(git show "${release_base}:${inventory_path}" 2>/dev/null | sed -n '1p' || true)"
          if [ "${actual_header}" != "${expected_header}" ]; then
            previous_base="${release_base}"
            release_base=""
            while read -r revision; do
              actual_header="$(git show "${revision}:${inventory_path}" 2>/dev/null | sed -n '1p' || true)"
              if [ "${actual_header}" = "${expected_header}" ]; then
                release_base="${revision}"
                break
              fi
            done < <(git log --reverse --format=%H "${previous_base}..HEAD" -- "${inventory_path}")
          fi
          test -n "${release_base}"
          python3 -m unittest scripts/tests/test_documentation_check.py
          python3 scripts/check-documentation.py --strict --base-ref "${release_base}"

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify backend and database migrations
        run: ./gradlew :backend:check --no-daemon --console=plain

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish images
        id: images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          owner="$(printf '%s' "${OWNER}" | tr '[:upper:]' '[:lower:]')"
          backend="ghcr.io/${owner}/store-analytics-backend:${GITHUB_SHA}"
          web="ghcr.io/${owner}/store-analytics-web:${GITHUB_SHA}"

          docker build --pull --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            --file backend/Dockerfile --tag "${backend}" .
          docker build --pull --build-arg SOURCE_COMMIT="${GITHUB_SHA}" \
            --file frontend/Dockerfile --tag "${web}" .
          backend_revision="$(docker image inspect \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${backend}")"
          web_revision="$(docker image inspect \
            --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${web}")"
          test "${backend_revision}" = "${GITHUB_SHA}"
          test "${web_revision}" = "${GITHUB_SHA}"

          docker push "${backend}"
          docker push "${web}"

          backend_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${backend}")"
          web_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${web}")"
          backend_remote_revision="$(docker buildx imagetools inspect "${backend_digest}" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          web_remote_revision="$(docker buildx imagetools inspect "${web_digest}" \
            --format '{{ index .Image.Config.Labels "org.opencontainers.image.revision" }}')"
          test "${backend_remote_revision}" = "${GITHUB_SHA}"
          test "${web_remote_revision}" = "${GITHUB_SHA}"

          {
            printf 'backend=%s\n' "${backend_digest}"
            printf 'web=%s\n' "${web_digest}"
          } >>"${GITHUB_OUTPUT}"

      - name: Publish release coordinates
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          {
            printf '## Immutable production images\n\n'
            printf -- '- Commit: `%s`\n' "${GITHUB_SHA}"
            printf -- '- Backend: `%s`\n' "${BACKEND_IMAGE}"
            printf -- '- Web: `%s`\n' "${WEB_IMAGE}"
          } >>"${GITHUB_STEP_SUMMARY}"
