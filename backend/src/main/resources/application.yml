spring:
  application:
    name: store-analytics
  profiles:
    default: dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/store_analytics}
    username: ${SPRING_DATASOURCE_USERNAME:store_analytics}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  livesklad:
    base-url: ${LIVESKLAD_BASE_URL:}
    login: ${LIVESKLAD_LOGIN:}
    password: ${LIVESKLAD_PASSWORD:}
    connect-timeout: ${LIVESKLAD_CONNECT_TIMEOUT:5s}
    read-timeout: ${LIVESKLAD_READ_TIMEOUT:30s}
