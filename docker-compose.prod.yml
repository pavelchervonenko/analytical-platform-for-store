services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_RUNTIME_ROLE: ${APP_RUNTIME_ROLE:-COMBINED}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      LIVESKLAD_BASE_URL: ${LIVESKLAD_BASE_URL}
      LIVESKLAD_ALLOWED_HOSTS: ${LIVESKLAD_ALLOWED_HOSTS}
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SECURITY_TELEMETRY_PSEUDONYM_KEY_ID: ${SECURITY_TELEMETRY_PSEUDONYM_KEY_ID:-prod-v1}
      INTERPRETATION_SNAPSHOT_ENABLED: ${INTERPRETATION_SNAPSHOT_ENABLED:-false}
      INTERPRETATION_AVAILABILITY_PREPARATION_SLA: ${INTERPRETATION_AVAILABILITY_PREPARATION_SLA:-5m}
      INTERPRETATION_AVAILABILITY_REFRESH_INTERVAL: ${INTERPRETATION_AVAILABILITY_REFRESH_INTERVAL:-15s}
      INTERPRETATION_AVAILABILITY_TARGET_READY_TIME: ${INTERPRETATION_AVAILABILITY_TARGET_READY_TIME:-08:00}
      INTERPRETATION_SNAPSHOT_WORKER_ENABLED: ${INTERPRETATION_SNAPSHOT_WORKER_ENABLED:-false}
      INTERPRETATION_SNAPSHOT_WORKER_DELAY: ${INTERPRETATION_SNAPSHOT_WORKER_DELAY:-5s}
      INTERPRETATION_SNAPSHOT_LEASE_DURATION: ${INTERPRETATION_SNAPSHOT_LEASE_DURATION:-10m}
      INTERPRETATION_SNAPSHOT_HEARTBEAT_INTERVAL: ${INTERPRETATION_SNAPSHOT_HEARTBEAT_INTERVAL:-1m}
      INTERPRETATION_SNAPSHOT_RETRY_INITIAL_DELAY: ${INTERPRETATION_SNAPSHOT_RETRY_INITIAL_DELAY:-30s}
      INTERPRETATION_SNAPSHOT_RETRY_MAX_DELAY: ${INTERPRETATION_SNAPSHOT_RETRY_MAX_DELAY:-15m}
      INTERPRETATION_SNAPSHOT_PLANNER_ENABLED: ${INTERPRETATION_SNAPSHOT_PLANNER_ENABLED:-false}
      INTERPRETATION_SNAPSHOT_PLANNER_SCAN_DELAY: ${INTERPRETATION_SNAPSHOT_PLANNER_SCAN_DELAY:-1m}
      INTERPRETATION_SNAPSHOT_REVISION_WINDOW: ${INTERPRETATION_SNAPSHOT_REVISION_WINDOW:-72h}
      INTERPRETATION_SNAPSHOT_PLANNER_BATCH_SIZE: ${INTERPRETATION_SNAPSHOT_PLANNER_BATCH_SIZE:-25}
      INTERPRETATION_SNAPSHOT_JOB_MAX_ATTEMPTS: ${INTERPRETATION_SNAPSHOT_JOB_MAX_ATTEMPTS:-5}
      INTERPRETATION_GENERATION_ENABLED: ${INTERPRETATION_GENERATION_ENABLED:-false}
      INTERPRETATION_GENERATION_PLANNER_ENABLED: ${INTERPRETATION_GENERATION_PLANNER_ENABLED:-false}
      INTERPRETATION_GENERATION_PLANNER_SCAN_DELAY: ${INTERPRETATION_GENERATION_PLANNER_SCAN_DELAY:-1m}
      INTERPRETATION_GENERATION_PLANNER_BATCH_SIZE: ${INTERPRETATION_GENERATION_PLANNER_BATCH_SIZE:-25}
      INTERPRETATION_GENERATION_JOB_DEADLINE: ${INTERPRETATION_GENERATION_JOB_DEADLINE:-5m}
      INTERPRETATION_GENERATION_WORKER_ENABLED: ${INTERPRETATION_GENERATION_WORKER_ENABLED:-false}
      INTERPRETATION_GENERATION_WORKER_DELAY: ${INTERPRETATION_GENERATION_WORKER_DELAY:-5s}
      INTERPRETATION_GENERATION_LEASE_DURATION: ${INTERPRETATION_GENERATION_LEASE_DURATION:-4m}
      INTERPRETATION_GENERATION_HEARTBEAT_INTERVAL: ${INTERPRETATION_GENERATION_HEARTBEAT_INTERVAL:-15s}
      INTERPRETATION_GENERATION_RECOVERY_DELAY: ${INTERPRETATION_GENERATION_RECOVERY_DELAY:-30s}
      INTERPRETATION_GENERATION_PROVIDER_CALL_TIMEOUT: ${INTERPRETATION_GENERATION_PROVIDER_CALL_TIMEOUT:-180s}
      INTERPRETATION_GENERATION_MAX_REQUEST_BYTES: ${INTERPRETATION_GENERATION_MAX_REQUEST_BYTES:-524288}
      INTERPRETATION_GENERATION_MAX_ESTIMATED_COST_RUB: ${INTERPRETATION_GENERATION_MAX_ESTIMATED_COST_RUB:-50.00}
      INTERPRETATION_PUBLICATION_ENABLED: ${INTERPRETATION_PUBLICATION_ENABLED:-false}
      LLM_PROMPT_VERSION: ${LLM_PROMPT_VERSION:-weekly-interpretation-v4}
      LLM_CONTENT_SCHEMA_VERSION: ${LLM_CONTENT_SCHEMA_VERSION:-2}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8000}
      LLM_MAX_PROVIDER_CALLS: ${LLM_MAX_PROVIDER_CALLS:-2}
      YANDEX_AI_FOLDER_ID: ${YANDEX_AI_FOLDER_ID:-}
      YANDEX_AI_MODEL_URI: ${YANDEX_AI_MODEL_URI:-}
      YANDEX_AI_CONNECT_TIMEOUT: ${YANDEX_AI_CONNECT_TIMEOUT:-5s}
      YANDEX_AI_READ_TIMEOUT: ${YANDEX_AI_READ_TIMEOUT:-180s}
      YANDEX_AI_CONTEXT_WINDOW_TOKENS: ${YANDEX_AI_CONTEXT_WINDOW_TOKENS:-32768}
      YANDEX_AI_MAX_RESPONSE_BYTES: ${YANDEX_AI_MAX_RESPONSE_BYTES:-1048576}
      YANDEX_AI_INPUT_RUB_PER_THOUSAND_TOKENS: ${YANDEX_AI_INPUT_RUB_PER_THOUSAND_TOKENS:-0.8}
      YANDEX_AI_CACHED_INPUT_RUB_PER_THOUSAND_TOKENS: ${YANDEX_AI_CACHED_INPUT_RUB_PER_THOUSAND_TOKENS:-0.8}
      YANDEX_AI_OUTPUT_RUB_PER_THOUSAND_TOKENS: ${YANDEX_AI_OUTPUT_RUB_PER_THOUSAND_TOKENS:-0.8}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_FANOUT_ENABLED: ${TELEGRAM_FANOUT_ENABLED:-false}
      TELEGRAM_BOT_CODE: ${TELEGRAM_BOT_CODE:-store-analytics-primary}
      TELEGRAM_FANOUT_DELAY: ${TELEGRAM_FANOUT_DELAY:-5s}
      TELEGRAM_DELIVERY_MAX_ATTEMPTS: ${TELEGRAM_DELIVERY_MAX_ATTEMPTS:-5}
      TELEGRAM_WEEKLY_RENDER_VERSION: ${TELEGRAM_WEEKLY_RENDER_VERSION:-weekly-telegram-v1}
      TELEGRAM_LINKING_ENABLED: ${TELEGRAM_LINKING_ENABLED:-false}
      TELEGRAM_WEBHOOK_ENABLED: ${TELEGRAM_WEBHOOK_ENABLED:-false}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_LINK_TOKEN_TTL: ${TELEGRAM_LINK_TOKEN_TTL:-10m}
      TELEGRAM_PENDING_CONFIRMATION_TTL: ${TELEGRAM_PENDING_CONFIRMATION_TTL:-10m}
      TELEGRAM_LINK_ISSUE_MIN_INTERVAL: ${TELEGRAM_LINK_ISSUE_MIN_INTERVAL:-30s}
      TELEGRAM_LINK_MAX_PER_HOUR: ${TELEGRAM_LINK_MAX_PER_HOUR:-5}
      TELEGRAM_WEBHOOK_MAX_BODY_BYTES: ${TELEGRAM_WEBHOOK_MAX_BODY_BYTES:-65536}
      TELEGRAM_DELIVERY_ENABLED: ${TELEGRAM_DELIVERY_ENABLED:-false}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}
      TELEGRAM_CONNECT_TIMEOUT: ${TELEGRAM_CONNECT_TIMEOUT:-5s}
      TELEGRAM_READ_TIMEOUT: ${TELEGRAM_READ_TIMEOUT:-15s}
      TELEGRAM_DELIVERY_DELAY: ${TELEGRAM_DELIVERY_DELAY:-5s}
      TELEGRAM_DELIVERY_LEASE_DURATION: ${TELEGRAM_DELIVERY_LEASE_DURATION:-1m}
      TELEGRAM_DELIVERY_RETRY_INITIAL_DELAY: ${TELEGRAM_DELIVERY_RETRY_INITIAL_DELAY:-15s}
      TELEGRAM_DELIVERY_RETRY_MAX_DELAY: ${TELEGRAM_DELIVERY_RETRY_MAX_DELAY:-5m}
      TELEGRAM_MAX_RESPONSE_BYTES: ${TELEGRAM_MAX_RESPONSE_BYTES:-65536}
      DAILY_STORE_PULSE_ENABLED: ${DAILY_STORE_PULSE_ENABLED:-false}
      DAILY_STORE_PULSE_PLANNER_DELAY: ${DAILY_STORE_PULSE_PLANNER_DELAY:-5m}
      DAILY_STORE_PULSE_SEND_AFTER: ${DAILY_STORE_PULSE_SEND_AFTER:-08:05}
      DAILY_STORE_PULSE_EXPIRES_AT: ${DAILY_STORE_PULSE_EXPIRES_AT:-14:00}
      DAILY_STORE_PULSE_POLICY_VERSION: ${DAILY_STORE_PULSE_POLICY_VERSION:-daily-store-pulse-v1}
      DAILY_STORE_PULSE_RENDER_VERSION: ${DAILY_STORE_PULSE_RENDER_VERSION:-daily-store-pulse-v2}
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: livesklad_login
        target: app.livesklad.login
      - source: livesklad_password
        target: app.livesklad.password
      - source: yandex_ai_api_key
        target: app.llm.yandex.api-key
      - source: telegram_bot_token
        target: app.notification.telegram.bot-token
      - source: telegram_webhook_secret
        target: app.notification.telegram.webhook-secret
      - source: security_telemetry_pseudonym_key
        target: app.security.telemetry.pseudonym-key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - internal
      - public

networks:
  internal:
    internal: true
  public:

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE}
  livesklad_login:
    file: ${LIVESKLAD_LOGIN_FILE}
  livesklad_password:
    file: ${LIVESKLAD_PASSWORD_FILE}
  yandex_ai_api_key:
    file: ${YANDEX_AI_API_KEY_FILE}
  telegram_bot_token:
    file: ${TELEGRAM_BOT_TOKEN_FILE}
  telegram_webhook_secret:
    file: ${TELEGRAM_WEBHOOK_SECRET_FILE}
  security_telemetry_pseudonym_key:
    file: ${SECURITY_TELEMETRY_PSEUDONYM_KEY_FILE}
