services:
  postgres:
    image: postgres:16-alpine
    container_name: store-analytics-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-store_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-store_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - store_analytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-store_analytics} -d ${POSTGRES_DB:-store_analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  store_analytics_pgdata:
